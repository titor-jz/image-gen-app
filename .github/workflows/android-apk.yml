name: Android APK

# 手动触发：Actions 页面 → Android APK → Run workflow
# 产物：Debug 签名 APK（可直接侧载安装），在 run 的 Artifacts 里下载
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest # runner 自带 Android SDK（ANDROID_HOME 已配置）
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21 # Capacitor 8 强制 Java 21（JDK 17 会报 invalid source release）

      - name: 安装依赖
        run: npm ci

      - name: 同步 Capacitor（web 资源与插件引用）
        run: npx cap sync android

      - name: 解码签名密钥（来自仓库 Secrets）
        working-directory: android # 必须在 android/ 下：keystore.properties 由 build.gradle 的 rootProject 解析
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
        run: |
          mkdir -p keystore
          echo "$APK_KEYSTORE_BASE64" | base64 -d > keystore/image-gen-release.p12
          printf "storeFile=../keystore/image-gen-release.p12\nstoreType=PKCS12\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" "$APK_KEY_PASSWORD" "$APK_KEY_ALIAS" "$APK_KEY_PASSWORD" > keystore.properties

      - name: 构建 APK（debug + release）
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: 列出产物（诊断）
        working-directory: android
        run: ls -R app/build/outputs/apk

      - name: 上传 Release APK（正式版）
        uses: actions/upload-artifact@v4
        with:
          name: imagegen-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: 上传 Debug APK（调试用）
        uses: actions/upload-artifact@v4
        with:
          name: imagegen-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
