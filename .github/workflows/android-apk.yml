name: Android APK

# 手动触发：Actions 页面 → Android APK → Run workflow
# 产物：Debug 签名 APK（可直接侧载安装），在 run 的 Artifacts 里下载
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest # runner 自带 Android SDK（ANDROID_HOME 已配置）
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装依赖
        run: npm ci

      - name: 同步 Capacitor（web 资源与插件引用）
        run: npx cap sync android

      - name: 构建 Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: imagegen-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
